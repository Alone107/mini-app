<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/swiper-bundle.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <div class="container">
          <div class="header-wrapper">
            <div class="header-left">
              <div class="header-block">
                <img src="images/game-hub.webp" alt="" />
                <span>GAMEHUB SHOP</span>
              </div>
            </div>
            <div class="header-burger" id="burgerMenuBtn">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
      </header>
      <main class="main">
        <section class="slider">
          <div class="swiper swiper-slider">
            <div class="swiper-wrapper">
              <div class="swiper-slide">
                <img src="images/slider/1.jpg" alt="" />
                <div class="slide-pagination">
                  <span class="pagination-item active"></span>
                  <span class="pagination-item"></span>
                  <span class="pagination-item"></span>
                </div>
              </div>
              <div class="swiper-slide">
                <img src="images/slider/2.jpg" alt="" />
                <div class="slide-pagination">
                  <span class="pagination-item"></span>
                  <span class="pagination-item active"></span>
                  <span class="pagination-item"></span>
                </div>
              </div>
              <div class="swiper-slide">
                <img src="images/slider/3.webp" alt="" />
                <div class="slide-pagination">
                  <span class="pagination-item"></span>
                  <span class="pagination-item"></span>
                  <span class="pagination-item active"></span>
                </div>
              </div>
            </div>
          </div>
        </section>
        <section class="catalog">
          <div class="container">
            <div class="catalog-title">Каталог</div>
            <div class="catalog-category">
              <div class="catalog-category-item" data-category="PlayStation">
                <img src="images/category/PlayStation_App_Icon.jpg" alt="" />
                <div
                  style="background-color: blue"
                  class="catalog-category-name"
                >
                  <span>PlayStation</span>
                </div>
              </div>
              <div class="catalog-category-item" data-category="XBOX">
                <img src="images/category/xbox.jfif" alt="" />
                <div
                  style="background-color: green"
                  class="catalog-category-name"
                >
                  <span>XBOX</span>
                </div>
              </div>
              <div class="catalog-category-item" data-category="Steam">
                <img src="images/category/steam.webp" alt="" />
                <div
                  style="background-color: rgb(47, 98, 207)"
                  class="catalog-category-name"
                >
                  <span>Steam</span>
                </div>
              </div>
              <div class="catalog-category-item" data-category="Nintendo">
                <img src="images/category/nintendo.png" alt="" />
                <div
                  style="background-color: rgb(163, 15, 15)"
                  class="catalog-category-name"
                >
                  <span>Nintendo</span>
                </div>
              </div>
            </div>
          </div>
        </section>
        <section class="catalog-main">
          <div class="container">
            <div class="catalog-search"></div>
          </div>
        </section>
      </main>
      <footer class="footer">
        <div class="container">
          <div class="footer-wrapper">
            <div class="footer-links">
              <div class="footer-links-text">Полезные ссылки</div>
              <div class="footer-links-block">
                <a href="#">
                  <img src="images/star.png" alt="" />
                  <span>Отзывы</span>
                </a>
                <a href="#">
                  <img src="images/information.png" alt="" />
                  <span>Информация</span>
                </a>
              </div>
            </div>
            <div class="footer-socials">
              <div class="footer-socials-text">Наши соцсети</div>
              <div class="footer-socials-links">
                <a href="#">
                  <img src="images/avito.png" alt="" />
                </a>
                <a href="#">
                  <img src="images/max.svg" alt="" />
                </a>
                <a href="#">
                  <img src="images/tg.svg" alt="" />
                </a>
              </div>
            </div>
          </div>
        </div>
      </footer>

      <div class="burger-wrap" id="burgerMenu">
        <div class="burger-logo">
          <img src="images/game-hub.webp" alt="" />
          <span>GAMEHUB SHOP</span>
        </div>
        <div class="burger-links">
          <div class="burger-links-text">Полезные ссылки</div>
          <div class="burger-links-wrap">
            <a href="#">
              <img src="images/star.png" alt="" />
              <span>Отзывы</span>
            </a>
            <a href="#">
              <img src="images/information.png" alt="" />
              <span>Информация</span>
            </a>
          </div>
        </div>
        <div class="burger-socials">
          <div class="footer-socials-text">Наши соцсети</div>
          <div class="footer-socials-links">
            <a href="#">
              <img src="images/avito.png" alt="" />
            </a>
            <a href="#">
              <img src="images/max.svg" alt="" />
            </a>
            <a href="#">
              <img src="images/tg.svg" alt="" />
            </a>
          </div>
        </div>
      </div>

      <a href="#" class="messenger-vidjet">
        <img src="images/messenger.png" alt="" />
      </a>
      <button
        id="scrollToTop"
        title="Вернуться наверх"
        aria-label="Вернуться к началу страницы"
      >
        ↑
      </button>
    </div>
  </body>
  <script src="js/swiper-bundle.min.js"></script>
  <script src="js/main.js"></script>
</html>
