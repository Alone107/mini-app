<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/swiper-bundle.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="wrapper">
      <main class="main">
        <section class="cart">
          <div class="container">
            <div class="cart-row">
              <div class="cart-title">Корзина</div>
              <a href="index.html" class="cart-row-button"
                >Продолжить покупки</a
              >
            </div>

            <div class="cart-col">
              <span>1</span>
              товар
            </div>

            <div class="cart-wrapper">
              <div class="cart-item">
                <div class="cart-item-img">
                  <img src="images/cards/1.webp" alt="Турецкий аккаунт" />
                </div>
                <div class="cart-item-center">
                  <div class="cart-item-price">1000 руб.</div>
                  <div class="cart-item-name">Турецкий аккаунт</div>
                  <div class="cart-item-col">
                    <button class="minus">-</button>
                    <input
                      type="number"
                      class="quantity-input"
                      value="1"
                      min="1"
                    />
                    <button class="plus">+</button>
                  </div>
                </div>
                <div class="cart-item-close">x</div>
              </div>
            </div>

            <div class="cart-bottom">
              <div class="cart-bottom-col">В корзине 1 товар</div>
              <div class="cart-bottom-result">
                Итого: <span>1000</span> рублей
              </div>

              <a
                href="checkout.html"
                id="orderShow"
                class="cart-bottom-registration"
              >
                К оформлению
              </a>
            </div>
          </div>
        </section>
      </main>
      <footer class="footer">
        <div class="container">
          <div class="footer-wrapper">
            <div class="footer-links">
              <div class="footer-links-text">Полезные ссылки</div>
              <div class="footer-links-block">
                <a href="#">
                  <img src="images/star.png" alt="" />
                  <span>Отзывы</span>
                </a>
                <a href="#">
                  <img src="images/information.png" alt="" />
                  <span>Информация</span>
                </a>
              </div>
            </div>
            <div class="footer-socials">
              <div class="footer-socials-text">Наши соцсети</div>
              <div class="footer-socials-links">
                <a href="#">
                  <img src="images/avito.png" alt="" />
                </a>
                <a href="#">
                  <img src="images/max.svg" alt="" />
                </a>
                <a href="#">
                  <img src="images/tg.svg" alt="" />
                </a>
              </div>
            </div>
          </div>
        </div>
      </footer>

      <div class="burger-wrap" id="burgerMenu">
        <div class="burger-logo">
          <img src="images/game-hub.webp" alt="" />
          <span>GAMEHUB SHOP</span>
        </div>
        <div class="burger-links">
          <div class="burger-links-text">Полезные ссылки</div>
          <div class="burger-links-wrap">
            <a href="#">
              <img src="images/star.png" alt="" />
              <span>Отзывы</span>
            </a>
            <a href="#">
              <img src="images/information.png" alt="" />
              <span>Информация</span>
            </a>
          </div>
        </div>
        <div class="burger-socials">
          <div class="footer-socials-text">Наши соцсети</div>
          <div class="footer-socials-links">
            <a href="#">
              <img src="images/avito.png" alt="" />
            </a>
            <a href="#">
              <img src="images/max.svg" alt="" />
            </a>
            <a href="#">
              <img src="images/tg.svg" alt="" />
            </a>
          </div>
        </div>
      </div>

      <a href="#" class="messenger-vidjet">
        <img src="images/messenger.png" alt="" />
      </a>
      <button
        class="scrollToTop"
        id="scrollToTop"
        title="Вернуться наверх"
        aria-label="Вернуться к началу страницы"
      >
        ↑
      </button>
    </div>
  </body>
  <script src="js/cart-js.js"></script>
</html>
